name: Trending clip radar

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (GitHub may delay runs a few minutes)
  workflow_dispatch:
    inputs:
      game_name:
        description: "Twitch category to watch (try 'Grand Theft Auto V' before launch)"
        default: "Grand Theft Auto V"
      dry_run:
        description: "1 = print alerts in the log instead of posting to Discord"
        default: "0"

permissions:
  contents: write          # to commit state.json back

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install face/cutscene check (optional)
        continue-on-error: true      # if this fails, alerts still go out unchecked
        run: pip install -q "opencv-python-headless<5" numpy

      - name: Cache vehicle detector model
        uses: actions/cache@v4
        with:
          path: models
          key: yolox-2022nov-v1

      - name: Download vehicle detector model (optional)
        continue-on-error: true      # without it the radar falls back to title keywords
        run: |
          mkdir -p models
          if [ ! -s models/yolox.onnx ]; then
            # download to a temp name; only a full-size file becomes the model
            curl -sSL --fail --retry 3 -o models/yolox.onnx.part \
              https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/object_detection_yolox/object_detection_yolox_2022nov.onnx || true
            size=$(stat -c %s models/yolox.onnx.part 2>/dev/null || echo 0)
            echo "model bytes: $size"
            if [ "$size" -gt 30000000 ]; then mv models/yolox.onnx.part models/yolox.onnx
            else rm -f models/yolox.onnx.part; echo "model download failed; using titles only"; fi
          fi

      - name: Tests
        run: |
          pip install -q pytest
          python -m pytest -q tests

      - name: Run radar
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GAME_NAME: ${{ inputs.game_name || vars.GAME_NAME || 'Grand Theft Auto VI' }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          LOOKBACK_HOURS: ${{ vars.LOOKBACK_HOURS || '6' }}
          MIN_VIEWS: ${{ vars.MIN_VIEWS || '50' }}
          TOP_N: ${{ vars.TOP_N || '5' }}
          LANGUAGES: ${{ vars.LANGUAGES || '*' }}
        run: python radar.py

      - name: Save state
        run: |
          git config user.name "wasteddubs-radar"
          git config user.email "actions@users.noreply.github.com"
          cp state.json "$RUNNER_TEMP/ours.json"
          for i in 1 2 3 4; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            python radar.py --merge-state "$RUNNER_TEMP/ours.json" state.json
            git add state.json
            git diff --cached --quiet && exit 0
            git commit -q -m "radar state [skip ci]"
            git push -q && exit 0
            sleep $((i * 5))
          done
          echo "state push failed"; exit 1
